<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QSTORE ZEN -- Premium UI Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F6F6FA;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            color: #1D1D1F;
        }
        .liquid-glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.02), inset 0 1px 2px rgba(255, 255, 255, 0.9);
            transition: all 400ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        .liquid-glass-dark {
            background: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }
        
        .mesh-background {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: #F4F5F9;
            overflow: hidden;
        }
        .liquid-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            mix-blend-mode: multiply;
            opacity: 0.15;
            animation: floatingMesh 20s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 700px; height: 700px; top: -100px; left: -100px;
            background: radial-gradient(circle, #06b6d4 0%, rgba(255,255,255,0) 70%);
        }
        .orb-2 {
            width: 800px; height: 800px; bottom: -150px; right: -100px;
            background: radial-gradient(circle, #9333ea 0%, rgba(255,255,255,0) 70%);
            animation-delay: -6s;
        }
        .orb-3 {
            width: 600px; height: 600px; top: 40%; left: 30%;
            background: radial-gradient(circle, #ec4899 0%, rgba(255,255,255,0) 70%);
            animation-delay: -12s;
        }
        @keyframes floatingMesh {
            0% { transform: translate(0, 0) scale(1); filter: blur(140px) hue-rotate(0deg); opacity: 0.13; }
            50% { transform: translate(80px, -60px) scale(1.15); filter: blur(160px) hue-rotate(180deg); opacity: 0.18; }
            100% { transform: translate(-40px, 40px) scale(0.9); filter: blur(140px) hue-rotate(360deg); opacity: 0.13; }
        }

        .apple-spring {
            transition: all 300ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        .apple-spring:hover { transform: translateY(-2px); }
        .apple-spring:active { transform: scale(0.96); }
        .progress-fill { transition: width 1s linear; }
        
        @keyframes dynamicWave {
            0% { transform: scale(0.95); opacity: 0.6; filter: hue-rotate(0deg); }
            50% { transform: scale(1.25); opacity: 0.3; filter: hue-rotate(180deg); }
            100% { transform: scale(1.55); opacity: 0; filter: hue-rotate(360deg); }
        }
        .visual-wave-1 { animation: dynamicWave 4s infinite cubic-bezier(0.25, 1, 0.5, 1); }
        .visual-wave-2 { animation: dynamicWave 4s infinite cubic-bezier(0.25, 1, 0.5, 1); animation-delay: 2s; }

        @keyframes opacityFade {
            0% { opacity: 0; transform: translateY(4px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-msg { animation: opacityFade 0.5s ease-out forwards; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div id="root"></div>

    <div class="mesh-background">
        <div class="liquid-orb orb-1"></div>
        <div class="liquid-orb orb-2"></div>
        <div class="liquid-orb orb-3"></div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SINGLE_VOICE_FILE = "audio/female_1.mp3";
        const SOUND_NAMES = { drone: 'Космос', waves: 'Океан', wind: 'Ветер', bell: 'Чаши' };

        const ALL_SESSIONS = [
            { id: 1, title: "Утренний фокус и созерцание", duration: 10, category: "Осознанность", sound: "drone", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { id: 2, title: "Глубокое ментальное сканирование", duration: 15, category: "Осознанность", sound: "bell", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { id: 3, title: "Погружение в настоящее мгновение", duration: 12, category: "Осознанность", sound: "waves", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
            
            { id: 4, title: "Погружение в дельта-фазу", duration: 40, category: "Сон", sound: "waves", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
            { id: 5, title: "Колыбельная ночного ветра", duration: 25, category: "Сон", sound: "wind", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" },
            
            { id: 6, title: "Разгрузка после сложных клиентов", duration: 15, category: "Снижение стресса", sound: "waves", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3" },
            { id: 7, title: "Растворение тревоги и напряжения", duration: 10, category: "Снижение стресса", sound: "wind", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" },
            
            { id: 8, title: "Состояние потока и продуктивности", duration: 25, category: "Фокус и концентрация", sound: "wind", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3" },
            { id: 9, title: "Альфа-волны для архитекторов продаж", duration: 20, category: "Фокус и концентрация", sound: "drone", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3" },
            
            { id: 10, title: "Прилив сил и нейро-мотивация", duration: 8, category: "Энергия", sound: "bell", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3" },
            { id: 11, title: "Заряд бодрости на остаток смены", duration: 12, category: "Энергия", sound: "drone", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3" },
            
            { id: 12, title: "Внутренняя гармония и тепло", duration: 14, category: "Благодарность", sound: "drone", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-13.mp3" },
            { id: 13, title: "Благодарность уходящему дню", duration: 10, category: "Благодарность", sound: "bell", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-14.mp3" },
            
            { id: 14, title: "Экспресс-дзен во время перерыва", duration: 5, category: "Быстрое расслабление", sound: "wind", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" },
            { id: 15, title: "Минутка ментального покоя", duration: 3, category: "Быстрое расслабление", sound: "bell", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-16.mp3" }
        ];

        const DIRECTIONS = [
            { id: "mind", title: "Осознанность", bg: "bg-[#E6F2FF]", iconColor: "text-[#3B82F6]", symbol: "✦" },
            { id: "sleep", title: "Сон", bg: "bg-[#F3E8FF]", iconColor: "text-[#9333EA]", symbol: "☾" },
            { id: "stress", title: "Снижение стресса", bg: "bg-[#E6FDF5]", iconColor: "text-[#10B981]", symbol: "❖" },
            { id: "focus", title: "Фокус и концентрация", bg: "bg-[#FAE8FF]", iconColor: "text-[#D946EF]", symbol: "⬡" },
            { id: "energy", title: "Энергия", bg: "bg-[#FEF3C7]", iconColor: "text-[#D97706]", symbol: "⚡" },
            { id: "breath", title: "Дыхательные практики", bg: "bg-[#E0F2FE]", iconColor: "text-[#0284C7]", symbol: "💨", isSpecial: true },
            { id: "gratitude", title: "Благодарность", bg: "bg-[#FCE7F3]", iconColor: "text-[#DB2777]", symbol: "♥" },
            { id: "quick", title: "Быстрое расслабление", bg: "bg-[#E0F2FE]", iconColor: "text-[#06B6D4]", symbol: "⏳" }
        ];

        const AudioEngine = {
            ctx: null, nodes: [], isPlaying: false,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playAmbient(type) {
                this.init(); this.stop(); this.isPlaying = true;
                const mainGain = this.ctx.createGain();
                mainGain.gain.setValueAtTime(0, this.ctx.currentTime);
                mainGain.gain.linearRampToValueAtTime(type === 'bell' ? 0.23 : 0.14, this.ctx.currentTime + 2);
                mainGain.connect(this.ctx.destination);
                this.nodes.push(mainGain);

                if (type === 'waves') {
                    const bufferSize = 5 * this.ctx.sampleRate;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer; noise.loop = true;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass'; filter.frequency.setValueAtTime(320, this.ctx.currentTime);
                    const lfo = this.ctx.createOscillator();
                    lfo.type = 'sine'; lfo.frequency.setValueAtTime(0.09, this.ctx.currentTime); 
                    const lfoGain = this.ctx.createGain();
                    lfoGain.gain.setValueAtTime(200, this.ctx.currentTime);
                    lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
                    noise.connect(filter); filter.connect(mainGain);
                    lfo.start(); noise.start(); this.nodes.push(lfo, noise);
                } else if (type === 'wind') {
                    const bufferSize = 4 * this.ctx.sampleRate;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer; noise.loop = true;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass'; filter.Q.setValueAtTime(2.5, this.ctx.currentTime);
                    const lfo = this.ctx.createOscillator();
                    lfo.type = 'sine'; lfo.frequency.setValueAtTime(0.12, this.ctx.currentTime);
                    const lfoGain = this.ctx.createGain();
                    lfoGain.gain.setValueAtTime(350, this.ctx.currentTime);
                    filter.frequency.setValueAtTime(750, this.ctx.currentTime);
                    lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
                    noise.connect(filter); filter.connect(mainGain);
                    lfo.start(); noise.start(); this.nodes.push(lfo, noise);
                } else if (type === 'bell') {
                    const freqs = [160, 320, 480, 640];
                    freqs.forEach((f, idx) => {
                        const osc = this.ctx.createOscillator(); osc.type = 'sine'; osc.frequency.setValueAtTime(f, this.ctx.currentTime);
                        const mod = this.ctx.createOscillator(); mod.type = 'sine'; mod.frequency.setValueAtTime(0.2 + idx * 0.08, this.ctx.currentTime);
                        const modGain = this.ctx.createGain(); modGain.gain.setValueAtTime(1.2, this.ctx.currentTime);
                        const oscGain = this.ctx.createGain(); oscGain.gain.setValueAtTime(0.04 / freqs.length, this.ctx.currentTime);
                        mod.connect(modGain); modGain.connect(osc.frequency);
                        osc.connect(oscGain); oscGain.connect(mainGain);
                        mod.start(); osc.start(); this.nodes.push(mod, osc);
                    });
                } else {
                    const baseFreqs = [60, 90, 120, 180];
                    baseFreqs.forEach((freq) => {
                        const osc = this.ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(110, this.ctx.currentTime);
                        const oscGain = this.ctx.createGain(); oscGain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                        osc.connect(filter); filter.connect(oscGain); oscGain.connect(mainGain);
                        osc.start(); this.nodes.push(osc);
                    });
                }
            },
            stop() {
                this.nodes.forEach(node => { try { node.stop(); } catch(e) {} node.disconnect(); });
                this.nodes = []; this.isPlaying = false;
            },
            setVolume(val) {
                if (this.nodes[0] && this.nodes[0].gain) this.nodes[0].gain.setTargetAtTime(val, this.ctx.currentTime, 0.1);
            }
        };

        const Icon = {
            Home: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>,
            Wind: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12.125 4.5V19.5M19.5 12.125H4.5" /></svg>,
            Play: () => <svg className="w-4 h-4 fill-current text-cyan-600" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>,
            Pause: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" /></svg>,
            Volume: () => <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M15.5 8.5a3 3 0 010 7M18.5 5.5a6.5 6.5 0 010 13M6 9H4.5A1.5 1.5 0 003 10.5v3A1.5 1.5 0 004.5 15H6l4.25 4.25a.75.75 0 001.25-.53V5.28a.75.75 0 00-1.25-.53L6 9z" /></svg>,
            Bolt: () => <svg className="w-4 h-4 fill-current mr-1.5" viewBox="0 0 24 24"><path d="M11 21h-1l1.5-6.5h-4.5c-.5 0-.8-.3-.9-.5-.1-.2 0-.6.2-.9l7.5-12h1l-1.5 6.5h4.5c.4 0 .7.2.8.5.1.3 0 .7-.2.9l-7.5 12z"/></svg>
        };

        function IqosMotivationalTicker() {
            const messages = [
                "Каждый проданный девайс делает мир вокруг технологичнее и чище!",
                "Клиенты чувствуют твою уверенность. Выдохни, улыбнись и взорви эту смену!",
                "Заряжай устройства на витрине и вовремя заряжай свой внутренний аккумулятор.",
                "Премиальный сервис QSTORE начинается с твоего личного внутреннего спокойствия."
            ];
            const [currentIndex, setCurrentIndex] = useState(0);
            const [key, setKey] = useState(0);

            useEffect(() => {
                const interval = setInterval(() => {
                    setCurrentIndex((prev) => (prev + 1) % messages.length);
                    setKey(k => k + 1);
                }, 7000); 
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="mt-8 mb-4 text-center px-4 max-w-xl mx-auto">
                    <div key={key} className="animate-msg text-xs font-semibold italic text-zinc-500 bg-white/60 border border-white/80 backdrop-blur-md py-3 px-5 rounded-2xl shadow-xs">
                        ✨ {messages[currentIndex]}
                    </div>
                </div>
            );
        }

        function PremiumZenApp() {
            const [currentTab, setCurrentTab] = useState('dashboard');
            const [selectedCategoryFilter, setSelectedCategoryFilter] = useState(null);
            const [activePlayerSession, setActivePlayerSession] = useState(null);
            
            const [userStreak, setUserStreak] = useState(4);
            const [userTotalMinutes, setUserTotalMinutes] = useState(75);

            const handleQuickStart = () => {
                const available = selectedCategoryFilter ? ALL_SESSIONS.filter(s => s.category === selectedCategoryFilter) : ALL_SESSIONS;
                const randomTrack = available[Math.floor(Math.random() * available.length)];
                setActivePlayerSession(randomTrack);
            };

            return (
                <div className="min-h-screen pb-36 pt-6 px-4 max-w-xl mx-auto relative select-none">
                    
                    <div className="mt-4">
                        {currentTab === 'dashboard' && (
                            <DashboardView 
                                streak={userStreak} totalMinutes={userTotalMinutes} 
                                activeCategory={selectedCategoryFilter} setActiveCategory={setSelectedCategoryFilter}
                                onStart={(s) => setActivePlayerSession(s)}
                                onQuickStart={handleQuickStart}
                                setTab={setCurrentTab}
                            />
                        )}
                        {currentTab === 'breathwork' && <BreathworkView />}
                    </div>

                    <IqosMotivationalTicker />

                    {activePlayerSession && (
                        <MeditationPlayerScreen 
                            session={activePlayerSession}
                            onClose={() => { AudioEngine.stop(); setActivePlayerSession(null); }}
                            onComplete={(mins) => {
                                setUserTotalMinutes(p => p + mins);
                                setActivePlayerSession(null);
                            }}
                        />
                    )}

                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-[88%] max-w-xs">
                        <div className="liquid-glass-dark rounded-[32px] p-1.5 flex items-center justify-between shadow-2xl">
                            <button onClick={() => { setCurrentTab('dashboard'); setSelectedCategoryFilter(null); }} className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl font-bold text-xs transition-all ${currentTab === 'dashboard' ? 'text-cyan-400 bg-white/10' : 'text-zinc-400'}`}>
                                <Icon.Home /> <span>Главная</span>
                            </button>
                            <button onClick={() => setCurrentTab('breathwork')} className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl font-bold text-xs transition-all ${currentTab === 'breathwork' ? 'text-cyan-400 bg-white/10' : 'text-zinc-400'}`}>
                                <Icon.Wind /> <span>Дыхание</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        function DashboardView({ streak, totalMinutes, activeCategory, setActiveCategory, onStart, onQuickStart, setTab }) {
            const displayedSessions = activeCategory ? ALL_SESSIONS.filter(s => s.category === activeCategory) : ALL_SESSIONS;
            
            // Ссылка для автоскролла вниз к началу списка треков
            const trackSectionRef = useRef(null);

            const handleDirectionClick = (dir) => {
                if (dir.isSpecial) {
                    setTab('breathwork');
                } else {
                    const nextCategory = activeCategory === dir.title ? null : dir.title;
                    setActiveCategory(nextCategory);
                    
                    // Если категория выбрана — плавно скроллим к трекам
                    if (nextCategory) {
                        setTimeout(() => {
                            trackSectionRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 100);
                    }
                }
            };

            return (
                <div className="space-y-8 text-center">
                    
                    {/* Статистика */}
                    <div className="liquid-glass rounded-[32px] p-6 flex flex-col items-center border border-white shadow-md">
                        <span className="text-[11px] font-extrabold tracking-widest text-cyan-600 bg-cyan-50 px-4 py-1.5 rounded-full mb-3">Команда QSTORE</span>
                        <h1 className="text-3xl font-black tracking-tight mb-2"><span className="text-black">QSTORE</span> <span className="text-cyan-500">ZEN</span></h1>
                        <p className="text-zinc-500 max-w-md text-xs font-medium mb-5">Музыкальный антистресс-баланс под задачи твоей смены.</p>

                        <div className="flex items-center justify-center gap-6 bg-white/90 border border-zinc-100 p-3 rounded-2xl shadow-xs w-full max-w-xs mb-5">
                            <div className="flex-1"><span className="block text-xl font-black text-zinc-900">{streak}</span><span className="text-[9px] font-bold text-zinc-400 uppercase">Дней серии</span></div>
                            <div className="w-[1px] h-6 bg-zinc-200" />
                            <div className="flex-1"><span className="block text-xl font-black text-zinc-900">{totalMinutes}</span><span className="text-[9px] font-bold text-zinc-400 uppercase">Всего минут</span></div>
                        </div>

                        <button 
                            onClick={onQuickStart} 
                            className="flex items-center justify-center w-full max-w-xs py-3.5 bg-gradient-to-r from-zinc-900 to-zinc-800 text-white font-bold text-xs rounded-2xl shadow-md apple-spring uppercase tracking-wider"
                        >
                            <Icon.Bolt /> Быстрый старт релаксации
                        </button>
                    </div>

                    {/* Направления (Фикс бага из IMG_9414.jpeg — заголовок больше не ломается!) */}
                    <div className="space-y-4">
                        <div className="flex items-center justify-between px-1 h-9">
                            <h2 className="text-lg font-extrabold text-zinc-900 tracking-tight whitespace-nowrap">
                                Выберите направление
                            </h2>
                            {activeCategory && (
                                <button 
                                    onClick={() => setActiveCategory(null)} 
                                    className="text-[11px] font-bold text-cyan-600 bg-white px-3 py-1.5 rounded-full shadow-xs border border-zinc-200/60 active:scale-95 transition-all whitespace-nowrap ml-2 animate-msg"
                                >
                                    Сбросить ×
                                </button>
                            )}
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3.5">
                            {DIRECTIONS.map((dir) => {
                                const isSelected = activeCategory === dir.title;
                                return (
                                    <div 
                                        key={dir.id}
                                        onClick={() => handleDirectionClick(dir)}
                                        className={`bg-white/95 rounded-[28px] p-5 flex flex-col items-center justify-center text-center aspect-square border apple-spring cursor-pointer select-none transition-all duration-200 ${
                                            isSelected 
                                                ? 'border-zinc-900 bg-zinc-50/50 shadow-inner scale-[0.97]' 
                                                : 'border-zinc-100/90 shadow-[0_4px_20px_rgba(0,0,0,0.015)]'
                                        }`}
                                    >
                                        <div className={`w-12 h-12 ${dir.bg} ${dir.iconColor} rounded-2xl flex items-center justify-center text-xl font-bold mb-4 shadow-3xs transition-transform ${isSelected ? 'scale-105' : ''}`}>
                                            {dir.symbol}
                                        </div>
                                        <span className={`text-[13px] font-bold leading-snug px-1 transition-colors ${isSelected ? 'text-zinc-950 font-extrabold' : 'text-zinc-800'}`}>
                                            {dir.title}
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Список треков с якорем для автоскролла */}
                    <div ref={trackSectionRef} className="space-y-3 text-left pt-2 scroll-mt-6">
                        <h3 className="text-xs font-extrabold text-zinc-400 uppercase tracking-wider px-1">
                            {activeCategory ? `Программы: ${activeCategory}` : 'Все доступные сессии'} ({displayedSessions.length})
                        </h3>
                        
                        <div className="space-y-2.5 max-h-[400px] overflow-y-auto pr-1 scrollbar-none pb-4">
                            {displayedSessions.map((session) => (
                                <div 
                                    key={session.id} 
                                    onClick={() => onStart(session)} 
                                    className="liquid-glass bg-white/80 hover:bg-white rounded-2xl p-4 flex items-center justify-between cursor-pointer apple-spring shadow-2xs border border-white group"
                                >
                                    <div className="space-y-1 pr-4 truncate">
                                        <div className="flex items-center gap-2">
                                            <span className="text-[9px] font-extrabold text-cyan-600 bg-cyan-50/70 px-2 py-0.5 rounded uppercase">
                                                {session.category}
                                            </span>
                                        </div>
                                        <h4 className="font-bold text-zinc-900 text-xs sm:text-sm truncate group-hover:text-cyan-600 transition-colors">
                                            {session.title}
                                        </h4>
                                        <div className="flex items-center gap-2 text-[10px] text-zinc-400 font-medium">
                                            <span>⏱ {session.duration} мин</span>
                                            <span>•</span>
                                            <span>🔊 {SOUND_NAMES[session.sound]}</span>
                                        </div>
                                    </div>
                                    <div className="w-8 h-8 rounded-full bg-zinc-50 group-hover:bg-cyan-50 flex items-center justify-center text-zinc-400 group-hover:text-cyan-600 transition-all shrink-0">
                                        <Icon.Play />
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                </div>
            );
        }

        function BreathworkView() {
            const [phase, setPhase] = useState('Вдох');
            const [timer, setTimer] = useState(4);
            const [active, setActive] = useState(false);

            useEffect(() => {
                let interval = null;
                if (active) {
                    interval = setInterval(() => {
                        setTimer(t => {
                            if (t <= 1) {
                                setPhase(p => p === 'Вдох' ? 'Задержка' : p === 'Задержка' ? 'Выдох' : 'Вдох');
                                return 4;
                            }
                            return t - 1;
                        });
                    }, 1000);
                } else { clearInterval(interval); }
                return () => clearInterval(interval);
            }, [active]);

            return (
                <div className="max-w-md mx-auto text-center space-y-6 pt-4">
                    <h2 className="text-xl font-black text-zinc-900">Антистресс-дыхание</h2>
                    <div className="liquid-glass bg-white rounded-[40px] aspect-square max-w-[240px] mx-auto flex flex-col justify-center items-center relative shadow-xs">
                        {active && (
                            <>
                                <div className="absolute inset-4 rounded-[32px] bg-cyan-400/10 blur-xl visual-wave-1 pointer-events-none" />
                                <div className="absolute inset-4 rounded-[32px] bg-indigo-400/10 blur-xl visual-wave-2 pointer-events-none" />
                            </>
                        )}
                        <h3 className="text-base font-bold z-10 text-zinc-800">{active ? phase : 'Квадрат баланса'}</h3>
                        <div className="text-4xl font-light mt-2 z-10 tabular-nums">{timer}с</div>
                    </div>
                    <button onClick={() => { setActive(!active); if(!active) AudioEngine.playAmbient('wind'); else AudioEngine.stop(); }} className="w-full max-w-[180px] py-3.5 bg-zinc-950 text-white rounded-full font-bold shadow-lg apple-spring text-xs uppercase tracking-wider">
                        {active ? 'Остановить' : 'Начать практику'}
                    </button>
                </div>
            );
        }

        function MeditationPlayerScreen({ session, onClose, onComplete }) {
            const [isPlaying, setIsPlaying] = useState(true);
            const [secondsRemaining, setSecondsRemaining] = useState(session.duration * 60);
            const [soundVolume, setSoundVolume] = useState(0.20);
            const [soundType, setSoundType] = useState(session.sound || 'drone');
            const [isVoiceEnabled, setIsVoiceEnabled] = useState(true);

            const voiceAudioRef = useRef(null);
            const streamMusicRef = useRef(null);
            const isSpeakingStateRef = useRef(false);

            useEffect(() => {
                voiceAudioRef.current = new Audio(SINGLE_VOICE_FILE);
                voiceAudioRef.current.loop = true;
                voiceAudioRef.current.volume = 0.85;

                streamMusicRef.current = new Audio(session.url);
                streamMusicRef.current.loop = true;
                streamMusicRef.current.volume = 0.5;

                if (isPlaying) {
                    streamMusicRef.current.play().catch(()=>{});
                    AudioEngine.playAmbient(soundType);
                    AudioEngine.setVolume(soundVolume);
                }

                return () => {
                    if (voiceAudioRef.current) voiceAudioRef.current.pause();
                    if (streamMusicRef.current) streamMusicRef.current.pause();
                    AudioEngine.stop();
                };
            }, []);

            useEffect(() => {
                if (isPlaying) {
                    AudioEngine.playAmbient(soundType);
                    AudioEngine.setVolume(soundVolume);
                    if (streamMusicRef.current) streamMusicRef.current.play().catch(()=>{});
                } else {
                    AudioEngine.stop();
                    if (voiceAudioRef.current) voiceAudioRef.current.pause();
                    if (streamMusicRef.current) streamMusicRef.current.pause();
                }
            }, [isPlaying, soundType]);

            useEffect(() => {
                let sessionTimer = null;
                if (isPlaying && secondsRemaining > 0) {
                    sessionTimer = setInterval(() => {
                        setSecondsRemaining(prev => {
                            const currentPassed = (session.duration * 60) - prev;
                            const positionInCycle = currentPassed % 42; 

                            if (isVoiceEnabled) {
                                if (positionInCycle < 12) {
                                    if (!isSpeakingStateRef.current && voiceAudioRef.current) {
                                        isSpeakingStateRef.current = true;
                                        voiceAudioRef.current.play().catch(()=>{});
                                    }
                                } else {
                                    if (isSpeakingStateRef.current && voiceAudioRef.current) {
                                        isSpeakingStateRef.current = false;
                                        voiceAudioRef.current.pause();
                                    }
                                }
                            } else {
                                if (voiceAudioRef.current) voiceAudioRef.current.pause();
                                isSpeakingStateRef.current = false;
                            }

                            if (prev <= 1) {
                                AudioEngine.stop();
                                if (voiceAudioRef.current) voiceAudioRef.current.pause();
                                if (streamMusicRef.current) streamMusicRef.current.pause();
                                onComplete(session.duration);
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(sessionTimer);
            }, [isPlaying, isVoiceEnabled, secondsRemaining]);

            const progressPercentage = (((session.duration * 60) - secondsRemaining) / (session.duration * 60)) * 100;

            return (
                <div className="fixed inset-0 z-50 bg-slate-50/95 backdrop-blur-3xl flex flex-col justify-between p-6 text-center">
                    <div className="flex items-center justify-between w-full max-w-md mx-auto">
                        <button onClick={() => { AudioEngine.stop(); if (voiceAudioRef.current) voiceAudioRef.current.pause(); if(streamMusicRef.current) streamMusicRef.current.pause(); onClose(); }} className="bg-zinc-200/80 text-zinc-900 px-5 py-2.5 rounded-full text-xs font-bold apple-spring">Назад</button>
                        <div className="text-center truncate max-w-[180px]">
                            <h2 className="font-extrabold text-zinc-900 text-xs truncate">{session.title}</h2>
                            <span className="text-[9px] font-bold text-cyan-600 block mt-0.5">Трек №{session.id}</span>
                        </div>
                        <button onClick={() => { AudioEngine.stop(); if (voiceAudioRef.current) voiceAudioRef.current.pause(); if(streamMusicRef.current) streamMusicRef.current.pause(); onComplete(session.duration); }} className="bg-zinc-900 text-white px-5 py-2.5 rounded-full text-xs font-bold apple-spring">Готово</button>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center relative">
                        {isPlaying && <div className="absolute w-60 h-60 rounded-full bg-gradient-to-tr from-cyan-400/20 to-purple-500/20 blur-md visual-wave-1 pointer-events-none" />}
                        
                        <div className="w-48 h-48 rounded-full liquid-glass flex flex-col items-center justify-center shadow-lg border border-white z-10">
                            <span className="text-4xl font-light tabular-nums text-zinc-900">{Math.floor(secondsRemaining / 60)}:{String(secondsRemaining % 60).padStart(2, '0')}</span>
                            <span className="text-[10px] font-black text-zinc-400 uppercase mt-1 tracking-wider">Осталось</span>
                        </div>
                    </div>

                    <div className="w-full max-w-sm mx-auto space-y-5 mb-4 z-10">
                        <div className="w-full bg-zinc-200 rounded-full h-1.5 overflow-hidden pointer-events-none">
                            <div style={{ width: `${progressPercentage}%` }} className="bg-gradient-to-r from-cyan-500 to-indigo-500 h-full progress-fill" />
                        </div>

                        <div className="flex items-center justify-center">
                            <button onClick={() => setIsPlaying(!isPlaying)} className="w-16 h-16 rounded-full bg-zinc-950 text-white flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-transform">
                                {isPlaying ? <Icon.Pause /> : <Icon.Play />}
                            </button>
                        </div>

                        <div className="bg-white border border-zinc-100 rounded-3xl p-4 space-y-4 shadow-sm">
                            <div>
                                <span className="block text-left text-[9px] font-black text-zinc-400 uppercase tracking-wider mb-2">Генерируемый био-шум</span>
                                <div className="grid grid-cols-4 gap-1.5 text-[11px] font-bold">
                                    {['drone', 'waves', 'wind', 'bell'].map((snd) => (
                                        <button key={snd} onClick={() => { setSoundType(snd); if(isPlaying) AudioEngine.playAmbient(snd); }} className={`py-2 rounded-xl transition-all ${soundType === snd ? 'bg-zinc-900 text-white shadow-xs' : 'bg-zinc-100 text-zinc-500 hover:bg-zinc-200'}`}>
                                            {SOUND_NAMES[snd]}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="pt-3 border-t border-zinc-100 flex items-center justify-between">
                                <div className="text-left">
                                    <span className="block text-xs font-bold text-zinc-800">Озвучка гида</span>
                                </div>
                                <button 
                                    onClick={() => setIsVoiceEnabled(!isVoiceEnabled)}
                                    className={`relative inline-flex h-5 w-10 items-center rounded-full transition-colors duration-300 ${isVoiceEnabled ? 'bg-cyan-500' : 'bg-zinc-200'}`}
                                >
                                    <span className={`inline-block h-3 w-3 transform rounded-full bg-white transition-transform duration-300 ${isVoiceEnabled ? 'translate-x-6' : 'translate-x-1'}`} />
                                </button>
                            </div>

                            <div className="flex items-center gap-3 pt-1">
                                <Icon.Volume />
                                <input type="range" min="0" max="0.5" step="0.05" value={soundVolume} onChange={(e) => { const nv = parseFloat(e.target.value); setSoundVolume(nv); AudioEngine.setVolume(nv); if(streamMusicRef.current) streamMusicRef.current.volume = nv * 2.5; }} className="w-full h-1 bg-zinc-200 appearance-none cursor-pointer accent-zinc-900" />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PremiumZenApp />);
    </script>
</body>
</html>
